plugins {
    id 'com.github.johnrengelman.shadow' version '7.1.2' apply false
}

defaultTasks 'clean', 'build'

def projectVersion = file('version.txt').text.trim()

def getConfigProperty(final String propertyName) {
    String value = project.findProperty(propertyName)
    if (!value) {
        value = System.getenv(propertyName)
        if (!value) {
            return null
        }
    }
    return value.trim()
}

def groupDeps(group, names, version) {
    def deps = []
    names.each { it ->
        {
            def nameAndClassifier = it.split(':')
            if (nameAndClassifier.size() < 2) {
                deps += [group: group, name: nameAndClassifier[0], version: version]
            } else {
                deps += [group: group, name: nameAndClassifier[0], version: version, classifier: nameAndClassifier[1]]
            }
        }
    }
    return deps
}

def addDepsFromProjects(pom, projects) {
    pom.withXml {
        def depsNode = asNode().appendNode('dependencies')
        def addedDeps = [] as Set

        projects.each { proj ->
            // api -> compile scope
            proj.configurations.api.allDependencies.each { dep ->
                if (dep instanceof ExternalModuleDependency
                        && addedDeps.add("${dep.group}:${dep.name}")) {
                    def node = depsNode.appendNode('dependency')
                    node.appendNode('groupId', dep.group)
                    node.appendNode('artifactId', dep.name)
                    node.appendNode('version', dep.version)
                    node.appendNode('scope', 'compile')
                }
            }

            // implementation -> runtime scope
            proj.configurations.implementation.allDependencies.each { dep ->
                if (dep instanceof ExternalModuleDependency
                        && addedDeps.add("${dep.group}:${dep.name}")) {
                    def node = depsNode.appendNode('dependency')
                    node.appendNode('groupId', dep.group)
                    node.appendNode('artifactId', dep.name)
                    node.appendNode('version', dep.version)
                    node.appendNode('scope', 'runtime')
                }
            }
        }
    }
}

ext {
    newaSrcJavaVersion = JavaVersion.toVersion(srcJavaVersion)

    // Sources are pure ASCII, and are never decoded with whatever encoding the build machine
    // happens to default to. javac reports any non-ASCII byte as an unmappable character. Write
    // one in a literal as \\uXXXX, and in javadoc as its ASCII equivalent ("--").
    newaSourceEncoding = 'US-ASCII'

    isRelease = !projectVersion.endsWith('-SNAPSHOT')

    sonatypeReleasesRepoUrl = isRelease
            ? 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            : 'https://central.sonatype.com/repository/maven-snapshots/'

    sonatypeUsername = getConfigProperty('SONATYPE_USERNAME')
    sonatypePassword = getConfigProperty('SONATYPE_PASSWORD')

    signingKey = getConfigProperty('SIGNING_GPG_SECRET_KEY')    // ascii-armored secret key
    signingPassword = getConfigProperty('SIGNING_GPG_PASSWORD') // plain text
}

def projectPom = {
    name = projectName
    // artifactId can be defined here optionally
    description = 'Netty-based minimalistic REST and Websocket server framework.'
    url = 'https://github.com/green4j/newa'

    scm {
        connection = 'scm:git:https://github.com/green4j/newa.git'
        developerConnection = 'scm:git:https://github.com/green4j/newa.git'
        url = 'https://github.com/green4j/newa.git'
    }

    licenses {
        license {
            name = 'MIT License'
            url = 'https://opensource.org/licenses/MIT'
        }
    }

    developers {
        developer {
            id = 'anatolygudkov'
            name = 'Anatoly Gudkov'
            email = 'gudkovanatoly@hotmail.com'
            url = 'https://github.com/anatolygudkov'
        }
    }
}

def commonProject = project(':newa-common')
def restProject = project(':newa-rest')
def websocketProject = project(':newa-websocket')
def allProject = project(':newa-all')
def exampleProject = project(':newa-example')
// Absent on a JDK older than 17 - see settings.gradle. Everything about it is therefore conditional.
def performanceProject = findProject(':newa-performance')

subprojects {
    apply plugin: 'java-library'

    group = projectGroup
    version = projectVersion

    repositories {
        mavenLocal()
        mavenCentral()
    }

    java {
        withSourcesJar()
        withJavadocJar()
    }

    // Every module, newa-all included: its aggregated javadoc is what ships in the javadoc jar, so it
    // needs the same encoding and doclint settings rather than javadoc's platform defaults.
    javadoc {
        failOnError false

        title = "<h1>${projectName}</h1>"
        options.bottom = "<i>Copyright &#169; ${projectCopyright}. All Rights Reserved.</i>"
        options.encoding = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.charSet = 'UTF-8'
        if (JavaVersion.current().isJava10Compatible()) {
            options.addBooleanOption 'html5', true
        }
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    jar {
        manifest {
            attributes 'Implementation-Title': projectName,
                    'Implementation-Version': projectVersion,
                    'Implementation-Vendor': projectAuthor
        }
        includeEmptyDirs = false
    }

    tasks.withType(Sign).configureEach {
        onlyIf {
            isRelease && gradle.taskGraph.hasTask(tasks.publish)
        }
    }
}

configure([commonProject,
           restProject,
           websocketProject,
           exampleProject]) {
    apply plugin: 'checkstyle'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:${jupiterVersion}"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

        checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
    }

    compileJava {
        sourceCompatibility = newaSrcJavaVersion
        targetCompatibility = newaSrcJavaVersion

        // --release rather than -source/-target alone: it also pins the API, and it keeps the
        // "bootstrap class path not set" note -- which -Werror turns into a failure -- off newer JDKs.
        options.release = newaSrcJavaVersion.majorVersion as Integer
        options.compilerArgs.addAll(['-Xlint:all', '-Werror']) // enable all warnings and treat them as errors
        options.encoding = newaSourceEncoding
        options.deprecation = true
    }

    compileTestJava {
        options.encoding = newaSourceEncoding
    }

    checkstyle {
        toolVersion = "${checkstyleVersion}"
    }

    test {
        useJUnitPlatform()

        // Every module hands buffers around by hand, so every module's tests run with the detector at its
        // strictest. It samples on garbage collection and reports rather than fails, so it is a net under
        // the refCnt assertions the ownership tests make, not a replacement for them.
        systemProperty 'io.netty.leakDetection.level', 'paranoid'
        systemProperty 'io.netty.leakDetection.targetRecords', '32'

        testLogging {
            events 'skipped', 'failed'
            showStandardStreams = true
            exceptionFormat = 'full'
            afterSuite { desc, result ->
                if (!desc.parent) {
                    println "Results: ${result.resultType} (${result.testCount} tests, " +
                            "${result.successfulTestCount} successes, " +
                            "${result.failedTestCount} failures, " +
                            "${result.skippedTestCount} skipped)"
                }
            }
        }
    }

}

// Coverage is for the published libraries only. The example servers exist to be read and run, and the
// benchmark in newa-performance is a measuring instrument - a coverage figure over either would be a number
// nobody should act on.
configure([commonProject,
           restProject,
           websocketProject]) {
    apply plugin: 'jacoco'

    check {
        dependsOn jacocoTestReport
    }
}

configure(commonProject) {
    dependencies {
        api "io.github.green4j:green-jelly:$greenJellyVersion"
        api(groupDeps('io.netty', [
                'netty-transport'
        ], nettyVersion))
    }

    publishing {
        publications {
            newaCommon(MavenPublication) {
                from components.java
                pom(projectPom)
            }
        }

        repositories {
            maven {
                name = 'MavenCentral'
                url(sonatypeReleasesRepoUrl)
                credentials {
                    username = sonatypeUsername
                    password = sonatypePassword
                }
            }
        }
    }

    signing {
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications.newaCommon
    }
}

configure(restProject) {
